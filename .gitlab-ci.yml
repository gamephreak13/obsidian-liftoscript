# .gitlab-ci.yml
#
# Mirror the GitLab repository to GitHub. On every push to the default branch
# (and on tags), a fresh clone of the GitLab repo is pushed to the GitHub
# mirror over SSH, so the two repos stay in sync without any manual steps.
#
# Required GitLab CI/CD variable:
#   SSH_PRIVATE_KEY - the PRIVATE half of a GitHub "Deploy key" with WRITE
#                     access, scoped to gamephreak13/obsidian-liftoscript.
#                     1. GitHub: repo -> Settings -> Deploy keys -> Add (write)
#                         -> paste the public key.
#                     2. Generate the key pair locally, e.g.:
#                           ssh-keygen -t ed25519 -C "gitlab-mirror" -f gitlab-mirror
#                         (Add the public key to GitHub as above; the private
#                          key goes into this CI/CD variable.)
#                     3. GitLab: Settings -> CI/CD -> Variables -> add a
#                        "File"-type variable named SSH_PRIVATE_KEY containing
#                        the private key text. Mark it Protected. (Mask cannot
#                        be enabled — GitLab refuses to mask multi-line values —
#                        but the key is loaded into ssh-agent and never echoed,
#                        so it stays out of the logs anyway.)
#
# The job SSH's to github.com using that deploy key and pushes the default
# branch plus all tags, keeping GitHub in lock-step with GitLab.

stages:
  - mirror

mirror-to-github:
  stage: mirror
  image: alpine/git:latest
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null"
  before_script:
    - apk add --no-cache openssh-client git
    # Load the deploy key's private key into an ssh-agent for this job.
    # SSH_PRIVATE_KEY is a *File-type* CI variable, so its value is the path
    # to a runner temp file already containing the key (with 0600 perms) —
    # ssh-add can consume that path directly.
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-add "$SSH_PRIVATE_KEY"
  script:
    - git config --global init.defaultBranch main
    # GitHub as the mirror remote, reached over SSH with the deploy key.
    - git remote add github git@github.com:gamephreak13/obsidian-liftoscript.git
    # Push the default branch and all tags so the mirror matches GitLab.
    - git push github "${CI_DEFAULT_BRANCH:-main}:main"
    - git push --tags github
  only:
    - main
    - tags
