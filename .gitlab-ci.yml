# .gitlab-ci.yml
#
# Mirror the GitLab repository to GitHub. On every push to the default branch
# (and on tags), a fresh clone of the GitLab repo is pushed to the GitHub
# mirror, so the two repos stay in sync without any manual steps.
#
# Required GitLab CI/CD variable:
#   GITHUB_PAT  - a GitHub Personal Access Token with `repo` scope
#                 (Settings -> Developer settings -> Personal access tokens).
#                 Add it under GitLab: Settings -> CI/CD -> Variables.

stages:
  - mirror

mirror-to-github:
  stage: mirror
  image: alpine/git:latest
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - apk add --no-cache openssh-client
    - git config --global credential.helper store
    - git config --global init.defaultBranch main
    # GitHub as the mirror remote. The token travels in the job log-free via
    # the CI/CD variable; the credential helper keeps it out of the prompt.
    - echo "https://x-access-token:${GITHUB_PAT}@github.com" > ~/.git-credentials
    - git remote add github https://x-access-token@github.com/gamephreak13/obsidian-liftoscript.git
    # Push the default branch and all tags so the mirror matches GitLab.
    - git push github "${CI_DEFAULT_BRANCH:-main}:main"
    - git push --tags github
  only:
    - main
    - tags
